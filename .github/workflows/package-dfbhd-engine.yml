name: Package DFBHD Engine Kit

on:
  push:
    branches:
      - devil-dfbhd-engine-1.7.0.0
    paths:
      - ".github/workflows/package-dfbhd-engine.yml"
      - "Devil-DFBHD-Engine-1.7.0.0/**"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ZIP
        run: |
          cd Devil-DFBHD-Engine-1.7.0.0
          zip -r ../Devil-DFBHD-Engine-1.7.0.0.zip .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Devil-DFBHD-Engine-1.7.0.0
          path: Devil-DFBHD-Engine-1.7.0.0.zip
          if-no-files-found: error
